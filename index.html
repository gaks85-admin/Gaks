    <meta charset="UTF-8" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gaks AI" />

    <meta property="og:title" content="Gaks AI" />
    <meta property="og:description" content="A sleek Forex market trading assistant with AI signals, customized strategy setup, and real-time watchlists." />
    <script>
      // Suppress Vite WebSocket errors in AI Studio environment
      (function() {
        const originalError = console.error;
        const originalWarn = console.warn;
        const isViteWS = (msg) => typeof msg === 'string' && (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('HMR'));
        
        console.error = function(...args) {
          if (isViteWS(args[0])) return;
          originalError.apply(console, args);
        };
        
        console.warn = function(...args) {
          if (isViteWS(args[0])) return;
          originalWarn.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          if (isViteWS(e.message) || isViteWS(e.filename)) {
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && isViteWS(e.reason.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-50 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
